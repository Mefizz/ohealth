name: Azure OpenAI connection test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-connection:
    if: github.repository == 'openhealths/nationHealth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
    steps:
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Send a short request to the deployed model
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = os.environ.get("AZURE_OPENAI_ENDPOINT", "").rstrip("/")
          deployment = os.environ.get("AZURE_OPENAI_DEPLOYMENT", "")
          parsed = urllib.parse.urlparse(endpoint)
          if (parsed.scheme != "https" or not parsed.hostname
                  or not parsed.hostname.endswith(".azure.com")
                  or parsed.path or parsed.query or parsed.fragment
                  or parsed.username or parsed.password):
              raise SystemExit("AZURE_OPENAI_ENDPOINT must be the Azure HTTPS resource base URL.")
          if not deployment:
              raise SystemExit("AZURE_OPENAI_DEPLOYMENT repository variable is missing.")

          token = subprocess.check_output([
              "az", "account", "get-access-token",
              "--resource", "https://cognitiveservices.azure.com",
              "--query", "accessToken", "--output", "tsv",
          ], text=True).strip()
          if not token:
              raise SystemExit("Azure did not return an access token.")
          print("::add-mask::" + token, flush=True)

          payload = {
              "model": deployment,
              "messages": [{"role": "user", "content": "Reply with the single word OK."}],
              "max_completion_tokens": 1024,
          }
          request = urllib.request.Request(
              endpoint + "/openai/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              try:
                  code = json.load(error).get("error", {}).get("code", "unknown")
              except (ValueError, AttributeError):
                  code = "unknown"
              raise SystemExit(f"Azure OpenAI request failed: HTTP {error.code}, code={code}")

          choices = result.get("choices", [])
          content = choices[0].get("message", {}).get("content") if choices else None
          if not isinstance(content, str) or not content.strip():
              raise SystemExit("Azure responded but the model returned no text. Check the token limit or content filter.")
          print("Success: GitHub OIDC authentication and Azure OpenAI inference work.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Azure OIDC authentication and model inference succeeded.\n")
          PY
